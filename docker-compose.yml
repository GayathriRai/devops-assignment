services:

  postgres:
    image: postgres:16-alpine

    container_name: todo-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U todo -d tododb"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./app/backend

    container_name: todo-backend

    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tododb
      DB_USER: todo
      DB_PASSWORD: todo_password

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "5000"


  frontend:
    image: nginx:alpine

    container_name: todo-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./app/frontend:/usr/share/nginx/html:ro
      - ./app/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend


volumes:

  postgres_data: